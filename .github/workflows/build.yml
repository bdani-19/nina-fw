name: Build Firmware

on:
  push:
    branches: [ pr-131 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nina-fw-builder .

      - name: Compile Firmware inside Docker
        run: docker run --rm -v $(pwd):/arduino-nina-fw -w /arduino-nina-fw nina-fw-builder make

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINA_W102_Firmware
          path: build/NINA_W102.bin
